<!DOCTYPE html>
<html>
<head>
    <title>Create Elderfy Icons</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        canvas { border: 1px solid #ddd; margin: 10px; }
        button {
            background: #6b8f7f;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover { background: #547261; }
        .icon-container { display: flex; flex-wrap: wrap; gap: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Generate Elderfy PWA Icons</h1>
    <p>Click the buttons below to download the icon files needed for the PWA:</p>

    <div class="icon-container">
        <canvas id="icon192" width="192" height="192"></canvas>
        <canvas id="icon512" width="512" height="512"></canvas>
        <canvas id="iconApple" width="180" height="180"></canvas>
    </div>

    <div>
        <button onclick="downloadIcon('icon192', 'icon-192x192.png')">Download 192x192 Icon</button>
        <button onclick="downloadIcon('icon512', 'icon-512x512.png')">Download 512x512 Icon</button>
        <button onclick="downloadIcon('iconApple', 'apple-touch-icon.png')">Download Apple Touch Icon</button>
    </div>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#6b8f7f');
            gradient.addColorStop(1, '#c8876a');

            // Background with rounded corners
            ctx.fillStyle = gradient;
            const radius = size * 0.22;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();

            // Person icon
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            const centerX = size / 2;
            const centerY = size * 0.42;
            const headRadius = size * 0.167;

            // Head
            ctx.beginPath();
            ctx.arc(centerX, centerY, headRadius, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + headRadius * 2, headRadius * 1.5, headRadius * 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Text
            ctx.fillStyle = 'white';
            ctx.font = `${size * 0.083}px Inter, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('Elderfy', centerX, size * 0.885);
        }

        function downloadIcon(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const url = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = filename;
            link.href = url;
            link.click();
        }

        // Draw all icons on page load
        window.onload = function() {
            drawIcon(document.getElementById('icon192'), 192);
            drawIcon(document.getElementById('icon512'), 512);
            drawIcon(document.getElementById('iconApple'), 180);
        };
    </script>
</body>
</html>
