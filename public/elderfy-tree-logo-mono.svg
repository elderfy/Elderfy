<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Single color radiant gradient -->
    <radialGradient id="monoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6b8f7f;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#6b8f7f;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#6b8f7f;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Radiant outer glow -->
  <circle cx="120" cy="120" r="110" fill="url(#monoGlow)" opacity="0.5"/>
  <circle cx="120" cy="120" r="95" fill="url(#monoGlow)" opacity="0.3"/>

  <!-- Intricate root system - organic flowing curves -->
  <g id="roots" stroke="#6b8f7f" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main central root with curves -->
    <path d="M 120 135 Q 118 150 120 165 Q 122 180 120 195" stroke-width="7" opacity="0.95"/>

    <!-- Left primary roots - flowing organically -->
    <path d="M 117 145 Q 105 155 95 168 Q 85 181 75 195 Q 68 205 60 215" stroke-width="5.5" opacity="0.9"/>
    <path d="M 115 150 Q 100 162 88 175 Q 76 188 65 200 Q 58 208 50 218" stroke-width="4.5" opacity="0.85"/>
    <path d="M 113 155 Q 95 165 80 180 Q 70 190 58 205" stroke-width="3.5" opacity="0.8"/>

    <!-- Right primary roots - mirrored flow -->
    <path d="M 123 145 Q 135 155 145 168 Q 155 181 165 195 Q 172 205 180 215" stroke-width="5.5" opacity="0.9"/>
    <path d="M 125 150 Q 140 162 152 175 Q 164 188 175 200 Q 182 208 190 218" stroke-width="4.5" opacity="0.85"/>
    <path d="M 127 155 Q 145 165 160 180 Q 170 190 182 205" stroke-width="3.5" opacity="0.8"/>

    <!-- Intricate tertiary roots -->
    <path d="M 85 170 Q 70 185 55 200 Q 45 210 35 220" stroke-width="3" opacity="0.7"/>
    <path d="M 155 170 Q 170 185 185 200 Q 195 210 205 220" stroke-width="3" opacity="0.7"/>
    <path d="M 95 165 Q 80 175 68 190 Q 58 200 48 212" stroke-width="2.5" opacity="0.65"/>
    <path d="M 145 165 Q 160 175 172 190 Q 182 200 192 212" stroke-width="2.5" opacity="0.65"/>

    <!-- Fine detail roots -->
    <path d="M 75 185 Q 62 195 50 208 Q 42 215 32 225" stroke-width="2" opacity="0.55"/>
    <path d="M 165 185 Q 178 195 190 208 Q 198 215 208 225" stroke-width="2" opacity="0.55"/>
    <path d="M 105 175 Q 95 185 85 198 Q 78 208 70 220" stroke-width="1.8" opacity="0.5"/>
    <path d="M 135 175 Q 145 185 155 198 Q 162 208 170 220" stroke-width="1.8" opacity="0.5"/>
  </g>

  <!-- Organic trunk with flowing texture -->
  <path d="M 112 135 Q 110 120 112 105 L 128 105 Q 130 120 128 135 Z" fill="#6b8f7f" opacity="0.85"/>
  <path d="M 113 125 Q 112 115 113 108" stroke="#6b8f7f" stroke-width="1" opacity="0.3"/>
  <path d="M 120 125 Q 120 115 120 108" stroke="#6b8f7f" stroke-width="1" opacity="0.3"/>
  <path d="M 127 125 Q 128 115 127 108" stroke="#6b8f7f" stroke-width="1" opacity="0.3"/>

  <!-- Intricate branch system - organic flowing curves -->
  <g id="branches" stroke="#6b8f7f" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Central upward flow -->
    <path d="M 120 105 Q 118 85 120 65 Q 122 45 120 30" stroke-width="6.5" opacity="0.95"/>

    <!-- Left branches - graceful curves -->
    <path d="M 117 95 Q 105 80 95 68 Q 85 56 75 45 Q 68 37 60 28" stroke-width="5" opacity="0.9"/>
    <path d="M 115 90 Q 100 78 88 65 Q 76 52 65 40 Q 58 32 50 25" stroke-width="4.5" opacity="0.85"/>
    <path d="M 113 85 Q 95 75 80 62 Q 70 52 58 40" stroke-width="3.5" opacity="0.8"/>

    <!-- Right branches - graceful curves -->
    <path d="M 123 95 Q 135 80 145 68 Q 155 56 165 45 Q 172 37 180 28" stroke-width="5" opacity="0.9"/>
    <path d="M 125 90 Q 140 78 152 65 Q 164 52 175 40 Q 182 32 190 25" stroke-width="4.5" opacity="0.85"/>
    <path d="M 127 85 Q 145 75 160 62 Q 170 52 182 40" stroke-width="3.5" opacity="0.8"/>

    <!-- Intricate tertiary branches -->
    <path d="M 85 70 Q 70 58 55 48 Q 45 40 35 30" stroke-width="3" opacity="0.75"/>
    <path d="M 155 70 Q 170 58 185 48 Q 195 40 205 30" stroke-width="3" opacity="0.75"/>
    <path d="M 95 75 Q 80 65 68 55 Q 58 47 48 38" stroke-width="2.5" opacity="0.7"/>
    <path d="M 145 75 Q 160 65 172 55 Q 182 47 192 38" stroke-width="2.5" opacity="0.7"/>

