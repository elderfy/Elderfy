    <path d="M 75 58 Q 62 48 50 38 Q 42 32 32 24" stroke-width="2" opacity="0.6"/>
    <path d="M 165 58 Q 178 48 190 38 Q 198 32 208 24" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Radiant luminous canopy - layered for depth -->
  <g id="canopy" fill="#6b8f7f">
    <!-- Outer glow halos -->
    <circle cx="120" cy="30" r="22" opacity="0.2"/>
    <circle cx="75" cy="45" r="24" opacity="0.2"/>
    <circle cx="165" cy="45" r="24" opacity="0.2"/>

    <!-- Central top cluster with radiance -->
    <circle cx="120" cy="28" r="16" opacity="0.9"/>
    <circle cx="110" cy="32" r="14" opacity="0.85"/>
    <circle cx="130" cy="32" r="14" opacity="0.85"/>
    <circle cx="120" cy="35" r="12" opacity="0.8"/>

    <!-- Left side intricate clusters -->
    <circle cx="75" cy="45" r="18" opacity="0.88"/>
    <circle cx="65" cy="52" r="15" opacity="0.82"/>
    <circle cx="85" cy="52" r="14" opacity="0.8"/>
    <circle cx="50" cy="48" r="16" opacity="0.85"/>
    <circle cx="92" cy="58" r="13" opacity="0.78"/>
    <circle cx="58" cy="60" r="11" opacity="0.75"/>

    <!-- Right side intricate clusters -->
    <circle cx="165" cy="45" r="18" opacity="0.88"/>
    <circle cx="175" cy="52" r="15" opacity="0.82"/>
    <circle cx="155" cy="52" r="14" opacity="0.8"/>
    <circle cx="190" cy="48" r="16" opacity="0.85"/>
    <circle cx="148" cy="58" r="13" opacity="0.78"/>
    <circle cx="182" cy="60" r="11" opacity="0.75"/>

    <!-- Additional detail clusters -->
    <circle cx="100" cy="42" r="12" opacity="0.83"/>
    <circle cx="140" cy="42" r="12" opacity="0.83"/>
    <circle cx="45" cy="38" r="13" opacity="0.8"/>
    <circle cx="195" cy="38" r="13" opacity="0.8"/>
    <circle cx="70" cy="62" r="10" opacity="0.75"/>
    <circle cx="170" cy="62" r="10" opacity="0.75"/>

    <!-- Tiny intricate details -->
    <circle cx="38" cy="32" r="8" opacity="0.7"/>
    <circle cx="202" cy="32" r="8" opacity="0.7"/>
    <circle cx="55" cy="70" r="8" opacity="0.65"/>
    <circle cx="185" cy="70" r="8" opacity="0.65"/>
  </g>

  <!-- Radiant root-ground luminous clusters -->
  <g id="root-earth" fill="#6b8f7f">
    <!-- Glow halos for roots -->
    <circle cx="120" cy="195" r="20" opacity="0.15"/>
    <circle cx="75" cy="195" r="18" opacity="0.15"/>
    <circle cx="165" cy="195" r="18" opacity="0.15"/>

    <!-- Central clusters -->
    <circle cx="120" cy="195" r="15" opacity="0.8"/>
    <circle cx="110" cy="192" r="12" opacity="0.75"/>
    <circle cx="130" cy="192" r="12" opacity="0.75"/>
    <circle cx="120" cy="200" r="11" opacity="0.7"/>

    <!-- Left clusters -->
    <circle cx="75" cy="195" r="14" opacity="0.78"/>
    <circle cx="65" cy="188" r="12" opacity="0.73"/>
    <circle cx="50" cy="200" r="13" opacity="0.75"/>
    <circle cx="85" cy="202" r="10" opacity="0.7"/>
    <circle cx="58" cy="208" r="9" opacity="0.65"/>

    <!-- Right clusters -->
    <circle cx="165" cy="195" r="14" opacity="0.78"/>
    <circle cx="175" cy="188" r="12" opacity="0.73"/>
    <circle cx="190" cy="200" r="13" opacity="0.75"/>
    <circle cx="155" cy="202" r="10" opacity="0.7"/>
    <circle cx="182" cy="208" r="9" opacity="0.65"/>

    <!-- Additional details -->
    <circle cx="45" cy="210" r="10" opacity="0.7"/>
    <circle cx="195" cy="210" r="10" opacity="0.7"/>
    <circle cx="35" cy="220" r="8" opacity="0.6"/>
    <circle cx="205" cy="220" r="8" opacity="0.6"/>
  </g>

  <!-- Central radiant energy point -->
  <circle cx="120" cy="120" r="8" fill="#6b8f7f" opacity="0.5"/>
  <circle cx="120" cy="120" r="4" fill="#6b8f7f" opacity="0.7"/>
</svg>
