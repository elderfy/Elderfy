<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radiant gradients -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE6B8;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#D4A574;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#C8876A;stop-opacity:0.2" />
    </radialGradient>

    <linearGradient id="trunkBark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6D5540;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#8B6F5A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7A6249;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#8D7059;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D5540;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="canopyRadiance" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6FD89C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A9B6F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D7A5A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="rootGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B7E20;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8942B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6F1E;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE6B8;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#D4A574;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#C8876A;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Radiant outer glow -->
  <circle cx="120" cy="120" r="110" fill="url(#aura)" opacity="0.6"/>
  <circle cx="120" cy="120" r="95" fill="url(#aura)" opacity="0.4"/>

  <!-- Realistic root system -->
  <g id="roots" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main taproot - thick at base, thinner as it goes down -->
    <path d="M 120 135 Q 119 145 120 155 Q 121 170 119 185 Q 118 195 120 205"
          stroke="url(#rootGlow)" stroke-width="8" fill="none" opacity="0.9"/>
    <path d="M 122 140 Q 123 160 122 180 Q 121 195 122 208"
          stroke="#8A6F1E" stroke-width="4" fill="none" opacity="0.6"/>

    <!-- Left primary root - splits naturally -->
    <path d="M 118 145 Q 108 152 98 162 Q 88 173 78 185 Q 70 195 62 208 Q 56 218 50 228"
          stroke="url(#rootGlow)" stroke-width="6.5" fill="none"/>
    <!-- Left root branch splits -->
    <path d="M 98 162 Q 90 168 82 178 Q 75 188 68 198 Q 62 207 56 218"
          stroke="#B8942B" stroke-width="4.5" fill="none" opacity="0.85"/>
    <path d="M 82 178 Q 74 186 66 196 Q 60 205 53 215"
          stroke="#9B7E20" stroke-width="3" fill="none" opacity="0.75"/>
    <!-- Secondary left root splits -->
    <path d="M 78 185 Q 68 193 58 203 Q 50 212 42 222"
          stroke="#8A6F1E" stroke-width="3.5" fill="none" opacity="0.7"/>
    <path d="M 68 198 Q 60 205 52 214 Q 46 220 40 227"
          stroke="#9B7E20" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- Right primary root - natural splitting -->
    <path d="M 122 145 Q 132 152 142 162 Q 152 173 162 185 Q 170 195 178 208 Q 184 218 190 228"
          stroke="url(#rootGlow)" stroke-width="6.5" fill="none"/>
    <!-- Right root branch splits -->
    <path d="M 142 162 Q 150 168 158 178 Q 165 188 172 198 Q 178 207 184 218"
          stroke="#B8942B" stroke-width="4.5" fill="none" opacity="0.85"/>
    <path d="M 158 178 Q 166 186 174 196 Q 180 205 187 215"
          stroke="#9B7E20" stroke-width="3" fill="none" opacity="0.75"/>
    <!-- Secondary right root splits -->
    <path d="M 162 185 Q 172 193 182 203 Q 190 212 198 222"
          stroke="#8A6F1E" stroke-width="3.5" fill="none" opacity="0.7"/>
    <path d="M 172 198 Q 180 205 188 214 Q 194 220 200 227"
          stroke="#9B7E20" stroke-width="2.5" fill="none" opacity="0.6"/>

    <!-- Tertiary fine roots -->
    <path d="M 88 173 Q 78 182 68 192 Q 60 200 52 210"
          stroke="#8A6F1E" stroke-width="2.2" fill="none" opacity="0.55"/>
    <path d="M 152 173 Q 162 182 172 192 Q 180 200 188 210"
          stroke="#8A6F1E" stroke-width="2.2" fill="none" opacity="0.55"/>
    <path d="M 75 195 Q 65 203 55 212 Q 48 219 42 226"
          stroke="#8A6F1E" stroke-width="1.8" fill="none" opacity="0.45"/>
    <path d="M 165 195 Q 175 203 185 212 Q 192 219 198 226"
          stroke="#8A6F1E" stroke-width="1.8" fill="none" opacity="0.45"/>
  </g>

  <!-- Realistic trunk with irregular edges and bark texture -->
  <g id="trunk">
    <!-- Main trunk body with natural taper -->
    <path d="M 108 135 Q 106 125 107 115 Q 108 100 109 90 Q 110 75 111 65 Q 112 55 113 48
             L 127 48 Q 128 55 129 65 Q 130 75 131 90 Q 132 100 133 115 Q 134 125 132 135 Z"
          fill="url(#trunkBark)"/>

    <!-- Left edge irregularities (bark bumps) -->
    <path d="M 108 130 Q 106 130 108 128" fill="#6D5540" opacity="0.6"/>
    <path d="M 107 110 Q 105 110 107 108" fill="#6D5540" opacity="0.6"/>
    <path d="M 109 85 Q 107 85 109 83" fill="#6D5540" opacity="0.6"/>
    <path d="M 111 60 Q 109 60 111 58" fill="#6D5540" opacity="0.6"/>

    <!-- Right edge irregularities -->
    <path d="M 132 130 Q 134 130 132 128" fill="#6D5540" opacity="0.6"/>
    <path d="M 133 110 Q 135 110 133 108" fill="#6D5540" opacity="0.6"/>
    <path d="M 131 85 Q 133 85 131 83" fill="#6D5540" opacity="0.6"/>
    <path d="M 129 60 Q 131 60 129 58" fill="#6D5540" opacity="0.6"/>

    <!-- Bark texture lines -->
    <path d="M 112 125 Q 111 110 112 95 Q 113 80 112 65"
          stroke="#5C4832" stroke-width="1.2" opacity="0.4" fill="none"/>
    <path d="M 120 125 Q 120 105 120 85 Q 120 70 120 55"
          stroke="#5C4832" stroke-width="1.5" opacity="0.5" fill="none"/>
    <path d="M 128 125 Q 129 110 128 95 Q 127 80 128 65"
          stroke="#5C4832" stroke-width="1.2" opacity="0.4" fill="none"/>

    <!-- Knots and bark details -->
    <ellipse cx="115" cy="100" rx="3" ry="4" fill="#5C4832" opacity="0.3"/>
    <ellipse cx="125" cy="118" rx="2.5" ry="3.5" fill="#5C4832" opacity="0.3"/>
    <ellipse cx="118" cy="75" rx="2" ry="3" fill="#5C4832" opacity="0.25"/>
  </g>

  <!-- Realistic branches with natural splitting and tapering -->
  <g id="branches" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main upward trunk continuation -->
    <path d="M 120 48 Q 119 40 120 32 Q 121 24 120 18"
          stroke="#8B6F5A" stroke-width="6" fill="none"/>

    <!-- Left primary branch - tapers naturally -->
    <path d="M 113 48 Q 105 44 97 38 Q 88 32 79 26 Q 72 21 65 16"
          stroke="#8B6F5A" stroke-width="5.5" fill="none"/>
    <!-- Left branch splits -->
    <path d="M 97 38 Q 90 34 83 29 Q 77 25 70 20"
          stroke="#7A6249" stroke-width="4" fill="none" opacity="0.9"/>
    <path d="M 83 29 Q 76 25 69 21 Q 64 18 58 14"
          stroke="#6D5540" stroke-width="2.8" fill="none" opacity="0.8"/>
    <!-- Secondary left splits -->
    <path d="M 79 26 Q 72 22 65 18 Q 60 15 54 11"
          stroke="#7A6249" stroke-width="3.2" fill="none" opacity="0.85"/>
    <path d="M 70 20 Q 63 16 56 12 Q 51 9 46 6"
          stroke="#6D5540" stroke-width="2.2" fill="none" opacity="0.75"/>

    <!-- Right primary branch - natural taper -->
    <path d="M 127 48 Q 135 44 143 38 Q 152 32 161 26 Q 168 21 175 16"
          stroke="#8B6F5A" stroke-width="5.5" fill="none"/>
    <!-- Right branch splits -->
    <path d="M 143 38 Q 150 34 157 29 Q 163 25 170 20"
          stroke="#7A6249" stroke-width="4" fill="none" opacity="0.9"/>
    <path d="M 157 29 Q 164 25 171 21 Q 176 18 182 14"
          stroke="#6D5540" stroke-width="2.8" fill="none" opacity="0.8"/>
    <!-- Secondary right splits -->
    <path d="M 161 26 Q 168 22 175 18 Q 180 15 186 11"
          stroke="#7A6249" stroke-width="3.2" fill="none" opacity="0.85"/>
    <path d="M 170 20 Q 177 16 184 12 Q 189 9 194 6"
          stroke="#6D5540" stroke-width="2.2" fill="none" opacity="0.75"/>

    <!-- Mid-level branches -->
    <path d="M 111 65 Q 102 60 93 54 Q 85 49 77 43 Q 71 39 65 34"
          stroke="#8B6F5A" stroke-width="4.5" fill="none" opacity="0.9"/>
    <path d="M 93 54 Q 85 49 77 44 Q 71 40 65 35"
          stroke="#7A6249" stroke-width="3" fill="none" opacity="0.8"/>

    <path d="M 129 65 Q 138 60 147 54 Q 155 49 163 43 Q 169 39 175 34"
          stroke="#8B6F5A" stroke-width="4.5" fill="none" opacity="0.9"/>
    <path d="M 147 54 Q 155 49 163 44 Q 169 40 175 35"
          stroke="#7A6249" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Upper branches - thinner -->
    <path d="M 116 55 Q 110 48 104 41 Q 99 35 94 29 Q 90 24 86 19"
          stroke="#7A6249" stroke-width="3.8" fill="none" opacity="0.85"/>
    <path d="M 104 41 Q 98 36 92 31 Q 88 27 83 22"
          stroke="#6D5540" stroke-width="2.5" fill="none" opacity="0.75"/>

    <path d="M 124 55 Q 130 48 136 41 Q 141 35 146 29 Q 150 24 154 19"
          stroke="#7A6249" stroke-width="3.8" fill="none" opacity="0.85"/>
    <path d="M 136 41 Q 142 36 148 31 Q 152 27 157 22"
          stroke="#6D5540" stroke-width="2.5" fill="none" opacity="0.75"/>

    <!-- Fine twig branches -->
    <path d="M 88 32 Q 82 28 76 24 Q 72 21 67 17"
          stroke="#6D5540" stroke-width="2" fill="none" opacity="0.65"/>
    <path d="M 152 32 Q 158 28 164 24 Q 168 21 173 17"
          stroke="#6D5540" stroke-width="2" fill="none" opacity="0.65"/>
    <path d="M 77 43 Q 70 38 63 33 Q 58 29 53 25"
          stroke="#6D5540" stroke-width="1.8" fill="none" opacity="0.6"/>
    <path d="M 163 43 Q 170 38 177 33 Q 182 29 187 25"
          stroke="#6D5540" stroke-width="1.8" fill="none" opacity="0.6"/>
  </g>

  <!-- Organic foliage clusters (not perfect circles) -->
  <g id="canopy">
    <!-- Central top clusters -->
    <ellipse cx="120" cy="18" rx="18" ry="16" fill="url(#glowCenter)" opacity="0.25"/>
    <ellipse cx="120" cy="18" rx="15" ry="13" fill="#6FD89C" opacity="0.9" transform="rotate(-15 120 18)"/>
    <ellipse cx="110" cy="22" rx="14" ry="12" fill="url(#canopyRadiance)" opacity="0.85" transform="rotate(8 110 22)"/>
    <ellipse cx="130" cy="22" rx="14" ry="12" fill="url(#canopyRadiance)" opacity="0.85" transform="rotate(-12 130 22)"/>
    <ellipse cx="120" cy="26" rx="11" ry="10" fill="#4A9B6F" opacity="0.82" transform="rotate(20 120 26)"/>

    <!-- Left side organic clusters -->
    <ellipse cx="65" cy="16" rx="20" ry="18" fill="url(#glowCenter)" opacity="0.25"/>
    <ellipse cx="65" cy="16" rx="16" ry="14" fill="#6FD89C" opacity="0.88" transform="rotate(25 65 16)"/>
    <ellipse cx="54" cy="22" rx="15" ry="13" fill="url(#canopyRadiance)" opacity="0.85" transform="rotate(-18 54 22)"/>
    <ellipse cx="77" cy="26" rx="14" ry="12" fill="#4A9B6F" opacity="0.82" transform="rotate(35 77 26)"/>
    <ellipse cx="70" cy="35" rx="13" ry="11" fill="#3D7A5A" opacity="0.78" transform="rotate(-8 70 35)"/>
    <ellipse cx="46" cy="29" rx="12" ry="10" fill="#4A9B6F" opacity="0.8" transform="rotate(15 46 29)"/>
    <ellipse cx="60" cy="42" rx="10" ry="9" fill="#3D7A5A" opacity="0.75" transform="rotate(-22 60 42)"/>

    <!-- Right side organic clusters -->
    <ellipse cx="175" cy="16" rx="20" ry="18" fill="url(#glowCenter)" opacity="0.25"/>
    <ellipse cx="175" cy="16" rx="16" ry="14" fill="#6FD89C" opacity="0.88" transform="rotate(-25 175 16)"/>
    <ellipse cx="186" cy="22" rx="15" ry="13" fill="url(#canopyRadiance)" opacity="0.85" transform="rotate(18 186 22)"/>
    <ellipse cx="163" cy="26" rx="14" ry="12" fill="#4A9B6F" opacity="0.82" transform="rotate(-35 163 26)"/>
    <ellipse cx="170" cy="35" rx="13" ry="11" fill="#3D7A5A" opacity="0.78" transform="rotate(8 170 35)"/>
    <ellipse cx="194" cy="29" rx="12" ry="10" fill="#4A9B6F" opacity="0.8" transform="rotate(-15 194 29)"/>
    <ellipse cx="180" cy="42" rx="10" ry="9" fill="#3D7A5A" opacity="0.75" transform="rotate(22 180 42)"/>

    <!-- Mid-level organic foliage -->
    <ellipse cx="85" cy="38" rx="13" ry="11" fill="#6FD89C" opacity="0.85" transform="rotate(12 85 38)"/>
    <ellipse cx="155" cy="38" rx="13" ry="11" fill="#6FD89C" opacity="0.85" transform="rotate(-12 155 38)"/>
    <ellipse cx="100" cy="32" rx="12" ry="10" fill="#4A9B6F" opacity="0.83" transform="rotate(-18 100 32)"/>
    <ellipse cx="140" cy="32" rx="12" ry="10" fill="#4A9B6F" opacity="0.83" transform="rotate(18 140 32)"/>

    <!-- Far edges -->
    <ellipse cx="38" cy="24" rx="11" ry="10" fill="#4A9B6F" opacity="0.75" transform="rotate(28 38 24)"/>
    <ellipse cx="202" cy="24" rx="11" ry="10" fill="#4A9B6F" opacity="0.75" transform="rotate(-28 202 24)"/>
    <ellipse cx="50" cy="48" rx="9" ry="8" fill="#3D7A5A" opacity="0.7" transform="rotate(-15 50 48)"/>
    <ellipse cx="190" cy="48" rx="9" ry="8" fill="#3D7A5A" opacity="0.7" transform="rotate(15 190 48)"/>
  </g>

  <!-- Root ground clusters (organic shapes) -->
  <g id="root-earth">
    <ellipse cx="120" cy="208" rx="14" ry="12" fill="#B8942B" opacity="0.7" transform="rotate(10 120 208)"/>
    <ellipse cx="110" cy="204" rx="11" ry="10" fill="#9B7E20" opacity="0.65" transform="rotate(-15 110 204)"/>
    <ellipse cx="130" cy="204" rx="11" ry="10" fill="#9B7E20" opacity="0.65" transform="rotate(15 130 204)"/>

    <ellipse cx="62" cy="208" rx="13" ry="11" fill="#B8942B" opacity="0.68" transform="rotate(20 62 208)"/>
    <ellipse cx="52" cy="215" rx="10" ry="9" fill="#8A6F1E" opacity="0.6" transform="rotate(-12 52 215)"/>
    <ellipse cx="72" cy="218" rx="9" ry="8" fill="#9B7E20" opacity="0.62" transform="rotate(25 72 218)"/>

    <ellipse cx="178" cy="208" rx="13" ry="11" fill="#B8942B" opacity="0.68" transform="rotate(-20 178 208)"/>
    <ellipse cx="188" cy="215" rx="10" ry="9" fill="#8A6F1E" opacity="0.6" transform="rotate(12 188 215)"/>
    <ellipse cx="168" cy="218" rx="9" ry="8" fill="#9B7E20" opacity="0.62" transform="rotate(-25 168 218)"/>

    <ellipse cx="42" cy="222" rx="9" ry="8" fill="#8A6F1E" opacity="0.58" transform="rotate(18 42 222)"/>
    <ellipse cx="198" cy="222" rx="9" ry="8" fill="#8A6F1E" opacity="0.58" transform="rotate(-18 198 222)"/>
  </g>

  <!-- Central radiant energy point -->
  <circle cx="120" cy="120" r="8" fill="url(#glowCenter)" opacity="0.5"/>
  <circle cx="120" cy="120" r="4" fill="#FFE6B8" opacity="0.7"/>
</svg>
