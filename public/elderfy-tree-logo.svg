<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radiant gradients -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE6B8;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#D4A574;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#C8876A;stop-opacity:0.2" />
    </radialGradient>

    <linearGradient id="trunkFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5A3C;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#A0826D;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#8D6E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#795548;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="canopyRadiance" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6FD89C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A9B6F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D7A5A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="rootGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A857;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8942B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B7E20;stop-opacity:1" />
    </linearGradient>

    <!-- Radiant aura -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE6B8;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#D4A574;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#C8876A;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Radiant outer glow -->
  <circle cx="120" cy="120" r="110" fill="url(#aura)" opacity="0.6"/>
  <circle cx="120" cy="120" r="95" fill="url(#aura)" opacity="0.4"/>

  <!-- Intricate root system - organic flowing curves -->
  <g id="roots" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Main central root with curves -->
    <path d="M 120 135 Q 118 150 120 165 Q 122 180 120 195"
          stroke="url(#rootGlow)" stroke-width="7" fill="none"/>

    <!-- Left primary roots - flowing organically -->
    <path d="M 117 145 Q 105 155 95 168 Q 85 181 75 195 Q 68 205 60 215"
          stroke="url(#rootGlow)" stroke-width="5.5" fill="none"/>
    <path d="M 115 150 Q 100 162 88 175 Q 76 188 65 200 Q 58 208 50 218"
          stroke="#D4A857" stroke-width="4.5" fill="none" opacity="0.9"/>
    <path d="M 113 155 Q 95 165 80 180 Q 70 190 58 205"
          stroke="#D4A857" stroke-width="3.5" fill="none" opacity="0.85"/>

    <!-- Right primary roots - mirrored flow -->
    <path d="M 123 145 Q 135 155 145 168 Q 155 181 165 195 Q 172 205 180 215"
          stroke="url(#rootGlow)" stroke-width="5.5" fill="none"/>
    <path d="M 125 150 Q 140 162 152 175 Q 164 188 175 200 Q 182 208 190 218"
          stroke="#D4A857" stroke-width="4.5" fill="none" opacity="0.9"/>
    <path d="M 127 155 Q 145 165 160 180 Q 170 190 182 205"
          stroke="#D4A857" stroke-width="3.5" fill="none" opacity="0.85"/>

    <!-- Intricate tertiary roots -->
    <path d="M 85 170 Q 70 185 55 200 Q 45 210 35 220"
          stroke="#B8942B" stroke-width="3" fill="none" opacity="0.75"/>
    <path d="M 155 170 Q 170 185 185 200 Q 195 210 205 220"
          stroke="#B8942B" stroke-width="3" fill="none" opacity="0.75"/>
    <path d="M 95 165 Q 80 175 68 190 Q 58 200 48 212"
          stroke="#B8942B" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 145 165 Q 160 175 172 190 Q 182 200 192 212"
          stroke="#B8942B" stroke-width="2.5" fill="none" opacity="0.7"/>

    <!-- Fine detail roots -->
    <path d="M 75 185 Q 62 195 50 208 Q 42 215 32 225"
          stroke="#9B7E20" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 165 185 Q 178 195 190 208 Q 198 215 208 225"
          stroke="#9B7E20" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 105 175 Q 95 185 85 198 Q 78 208 70 220"
          stroke="#9B7E20" stroke-width="1.8" fill="none" opacity="0.55"/>
    <path d="M 135 175 Q 145 185 155 198 Q 162 208 170 220"
          stroke="#9B7E20" stroke-width="1.8" fill="none" opacity="0.55"/>
  </g>

  <!-- Organic trunk with flowing texture -->
  <path d="M 112 135 Q 110 120 112 105 L 128 105 Q 130 120 128 135 Z"
        fill="url(#trunkFlow)"/>
  <path d="M 113 125 Q 112 115 113 108" stroke="#A0826D" stroke-width="1" opacity="0.4"/>
  <path d="M 120 125 Q 120 115 120 108" stroke="#A0826D" stroke-width="1" opacity="0.4"/>
  <path d="M 127 125 Q 128 115 127 108" stroke="#A0826D" stroke-width="1" opacity="0.4"/>

  <!-- Intricate branch system - organic flowing curves -->
  <g id="branches" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Central upward flow -->
    <path d="M 120 105 Q 118 85 120 65 Q 122 45 120 30"
          stroke="url(#trunkFlow)" stroke-width="6.5" fill="none"/>

    <!-- Left branches - graceful curves -->
    <path d="M 117 95 Q 105 80 95 68 Q 85 56 75 45 Q 68 37 60 28"
          stroke="#8B5A3C" stroke-width="5" fill="none"/>
    <path d="M 115 90 Q 100 78 88 65 Q 76 52 65 40 Q 58 32 50 25"
          stroke="#8D6E63" stroke-width="4.5" fill="none" opacity="0.9"/>
    <path d="M 113 85 Q 95 75 80 62 Q 70 52 58 40"
          stroke="#8D6E63" stroke-width="3.5" fill="none" opacity="0.85"/>

    <!-- Right branches - graceful curves -->
    <path d="M 123 95 Q 135 80 145 68 Q 155 56 165 45 Q 172 37 180 28"
          stroke="#8B5A3C" stroke-width="5" fill="none"/>
    <path d="M 125 90 Q 140 78 152 65 Q 164 52 175 40 Q 182 32 190 25"
          stroke="#8D6E63" stroke-width="4.5" fill="none" opacity="0.9"/>
    <path d="M 127 85 Q 145 75 160 62 Q 170 52 182 40"
          stroke="#8D6E63" stroke-width="3.5" fill="none" opacity="0.85"/>

    <!-- Intricate tertiary branches -->
    <path d="M 85 70 Q 70 58 55 48 Q 45 40 35 30"
          stroke="#795548" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 155 70 Q 170 58 185 48 Q 195 40 205 30"
          stroke="#795548" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 95 75 Q 80 65 68 55 Q 58 47 48 38"
          stroke="#795548" stroke-width="2.5" fill="none" opacity="0.75"/>
    <path d="M 145 75 Q 160 65 172 55 Q 182 47 192 38"
          stroke="#795548" stroke-width="2.5" fill="none" opacity="0.75"/>

    <!-- Fine detail branches -->
    <path d="M 75 58 Q 62 48 50 38 Q 42 32 32 24"
          stroke="#6D4C41" stroke-width="2" fill="none" opacity="0.65"/>
    <path d="M 165 58 Q 178 48 190 38 Q 198 32 208 24"
          stroke="#6D4C41" stroke-width="2" fill="none" opacity="0.65"/>
  </g>

  <!-- Radiant luminous canopy - layered for depth -->
  <g id="canopy">
    <!-- Outer glow halos -->
    <circle cx="120" cy="30" r="22" fill="url(#glowCenter)" opacity="0.3"/>
    <circle cx="75" cy="45" r="24" fill="url(#glowCenter)" opacity="0.3"/>
    <circle cx="165" cy="45" r="24" fill="url(#glowCenter)" opacity="0.3"/>

    <!-- Central top cluster with radiance -->
    <circle cx="120" cy="28" r="16" fill="#6FD89C" opacity="0.95"/>
    <circle cx="110" cy="32" r="14" fill="url(#canopyRadiance)" opacity="0.9"/>
    <circle cx="130" cy="32" r="14" fill="url(#canopyRadiance)" opacity="0.9"/>
    <circle cx="120" cy="35" r="12" fill="#4A9B6F" opacity="0.85"/>

    <!-- Left side intricate clusters -->
    <circle cx="75" cy="45" r="18" fill="#6FD89C" opacity="0.92"/>
    <circle cx="65" cy="52" r="15" fill="url(#canopyRadiance)" opacity="0.88"/>
    <circle cx="85" cy="52" r="14" fill="#4A9B6F" opacity="0.85"/>
    <circle cx="50" cy="48" r="16" fill="url(#canopyRadiance)" opacity="0.9"/>
    <circle cx="92" cy="58" r="13" fill="#3D7A5A" opacity="0.82"/>
    <circle cx="58" cy="60" r="11" fill="#4A9B6F" opacity="0.8"/>

    <!-- Right side intricate clusters -->
    <circle cx="165" cy="45" r="18" fill="#6FD89C" opacity="0.92"/>
    <circle cx="175" cy="52" r="15" fill="url(#canopyRadiance)" opacity="0.88"/>
    <circle cx="155" cy="52" r="14" fill="#4A9B6F" opacity="0.85"/>
    <circle cx="190" cy="48" r="16" fill="url(#canopyRadiance)" opacity="0.9"/>
    <circle cx="148" cy="58" r="13" fill="#3D7A5A" opacity="0.82"/>
    <circle cx="182" cy="60" r="11" fill="#4A9B6F" opacity="0.8"/>

    <!-- Additional detail clusters -->
    <circle cx="100" cy="42" r="12" fill="#6FD89C" opacity="0.88"/>
    <circle cx="140" cy="42" r="12" fill="#6FD89C" opacity="0.88"/>
    <circle cx="45" cy="38" r="13" fill="#4A9B6F" opacity="0.85"/>
    <circle cx="195" cy="38" r="13" fill="#4A9B6F" opacity="0.85"/>
    <circle cx="70" cy="62" r="10" fill="#3D7A5A" opacity="0.8"/>
    <circle cx="170" cy="62" r="10" fill="#3D7A5A" opacity="0.8"/>

    <!-- Tiny intricate details -->
    <circle cx="38" cy="32" r="8" fill="#6FD89C" opacity="0.75"/>
    <circle cx="202" cy="32" r="8" fill="#6FD89C" opacity="0.75"/>
    <circle cx="55" cy="70" r="8" fill="#4A9B6F" opacity="0.7"/>
    <circle cx="185" cy="70" r="8" fill="#4A9B6F" opacity="0.7"/>
  </g>

  <!-- Radiant root-ground luminous clusters -->
  <g id="root-earth">
    <!-- Glow halos for roots -->
    <circle cx="120" cy="195" r="20" fill="url(#glowCenter)" opacity="0.25"/>
    <circle cx="75" cy="195" r="18" fill="url(#glowCenter)" opacity="0.25"/>
    <circle cx="165" cy="195" r="18" fill="url(#glowCenter)" opacity="0.25"/>

    <!-- Central clusters -->
    <circle cx="120" cy="195" r="15" fill="#D4A857" opacity="0.85"/>
    <circle cx="110" cy="192" r="12" fill="url(#rootGlow)" opacity="0.8"/>
    <circle cx="130" cy="192" r="12" fill="url(#rootGlow)" opacity="0.8"/>
    <circle cx="120" cy="200" r="11" fill="#B8942B" opacity="0.75"/>

    <!-- Left clusters -->
    <circle cx="75" cy="195" r="14" fill="#D4A857" opacity="0.82"/>
    <circle cx="65" cy="188" r="12" fill="url(#rootGlow)" opacity="0.78"/>
    <circle cx="50" cy="200" r="13" fill="#B8942B" opacity="0.8"/>
    <circle cx="85" cy="202" r="10" fill="#9B7E20" opacity="0.75"/>
    <circle cx="58" cy="208" r="9" fill="#B8942B" opacity="0.7"/>

    <!-- Right clusters -->
    <circle cx="165" cy="195" r="14" fill="#D4A857" opacity="0.82"/>
    <circle cx="175" cy="188" r="12" fill="url(#rootGlow)" opacity="0.78"/>
    <circle cx="190" cy="200" r="13" fill="#B8942B" opacity="0.8"/>
    <circle cx="155" cy="202" r="10" fill="#9B7E20" opacity="0.75"/>
    <circle cx="182" cy="208" r="9" fill="#B8942B" opacity="0.7"/>

    <!-- Additional details -->
    <circle cx="45" cy="210" r="10" fill="#9B7E20" opacity="0.75"/>
    <circle cx="195" cy="210" r="10" fill="#9B7E20" opacity="0.75"/>
    <circle cx="35" cy="220" r="8" fill="#D4A857" opacity="0.65"/>
    <circle cx="205" cy="220" r="8" fill="#D4A857" opacity="0.65"/>
  </g>

  <!-- Central radiant energy point -->
  <circle cx="120" cy="120" r="8" fill="url(#glowCenter)" opacity="0.6"/>
  <circle cx="120" cy="120" r="4" fill="#FFE6B8" opacity="0.8"/>
</svg>
