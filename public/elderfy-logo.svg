<svg width="200" height="280" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radiant beacon gradient -->
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE6B8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F4D6A0;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#D4A574;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#C8876A;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="towerFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B7A5E;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#B89478;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#A0826D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F5A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="foliageGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6FD89C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A9B6F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D7A5A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="rootRadiance" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A857;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8942B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B7E20;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Radiant outer aura -->
  <ellipse cx="100" cy="140" rx="85" ry="130" fill="url(#beaconGlow)" opacity="0.2"/>

  <!-- Intricate root system -->
  <g id="roots" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left root flows -->
    <path d="M 85 240 Q 70 248 55 258 Q 42 266 30 275"
          stroke="url(#rootRadiance)" stroke-width="4.5" fill="none"/>
    <path d="M 80 245 Q 62 254 48 265 Q 38 272 28 278"
          stroke="#D4A857" stroke-width="3.5" fill="none" opacity="0.85"/>
    <path d="M 88 235 Q 75 242 65 252 Q 56 260 48 268"
          stroke="#B8942B" stroke-width="2.8" fill="none" opacity="0.75"/>
    <path d="M 82 250 Q 68 258 55 268"
          stroke="#9B7E20" stroke-width="2.2" fill="none" opacity="0.65"/>

    <!-- Right root flows -->
    <path d="M 115 240 Q 130 248 145 258 Q 158 266 170 275"
          stroke="url(#rootRadiance)" stroke-width="4.5" fill="none"/>
    <path d="M 120 245 Q 138 254 152 265 Q 162 272 172 278"
          stroke="#D4A857" stroke-width="3.5" fill="none" opacity="0.85"/>
    <path d="M 112 235 Q 125 242 135 252 Q 144 260 152 268"
          stroke="#B8942B" stroke-width="2.8" fill="none" opacity="0.75"/>
    <path d="M 118 250 Q 132 258 145 268"
          stroke="#9B7E20" stroke-width="2.2" fill="none" opacity="0.65"/>

    <!-- Central taproot -->
    <path d="M 100 245 Q 98 258 100 270"
          stroke="#D4A857" stroke-width="3.2" fill="none" opacity="0.7"/>

    <!-- Fine root details -->
    <path d="M 72 252 Q 58 262 45 272"
          stroke="#9B7E20" stroke-width="1.8" fill="none" opacity="0.5"/>
    <path d="M 128 252 Q 142 262 155 272"
          stroke="#9B7E20" stroke-width="1.8" fill="none" opacity="0.5"/>
  </g>

  <!-- Earth/root clusters -->
  <g id="root-earth">
    <circle cx="100" cy="272" r="10" fill="#D4A857" opacity="0.6"/>
    <circle cx="48" cy="268" r="8" fill="#B8942B" opacity="0.65"/>
    <circle cx="152" cy="268" r="8" fill="#B8942B" opacity="0.65"/>
    <circle cx="30" cy="275" r="7" fill="#9B7E20" opacity="0.55"/>
    <circle cx="170" cy="275" r="7" fill="#9B7E20" opacity="0.55"/>
    <circle cx="75" cy="265" r="6" fill="#D4A857" opacity="0.5"/>
    <circle cx="125" cy="265" r="6" fill="#D4A857" opacity="0.5"/>
  </g>

  <!-- Foundation - organic transition -->
  <path d="M 78 218 Q 75 228 72 238 L 85 238 Q 92 232 100 230 Q 108 232 115 238 L 128 238 Q 125 228 122 218 Z"
        fill="url(#towerFlow)" opacity="0.85"/>

  <!-- Main trunk/tower with organic curves -->
  <path d="M 85 90 Q 83 150 85 210 L 88 230 L 112 230 L 115 210 Q 117 150 115 90 Z"
        fill="url(#towerFlow)"/>

  <!-- Tower texture lines -->
  <path d="M 90 120 Q 90 160 92 200" stroke="#B89478" stroke-width="0.8" opacity="0.3"/>
  <path d="M 100 120 Q 100 160 100 200" stroke="#B89478" stroke-width="0.8" opacity="0.3"/>
  <path d="M 110 120 Q 110 160 108 200" stroke="#B89478" stroke-width="0.8" opacity="0.3"/>

  <!-- Lighthouse windows with glow -->
  <g id="windows">
    <circle cx="100" cy="115" r="9" fill="url(#beaconGlow)" opacity="0.3"/>
    <rect x="91" y="110" width="18" height="13" fill="#FFE6B8" opacity="0.7" rx="2"/>

    <circle cx="100" cy="148" r="9" fill="url(#beaconGlow)" opacity="0.3"/>
    <rect x="91" y="143" width="18" height="13" fill="#FFE6B8" opacity="0.65" rx="2"/>

    <circle cx="100" cy="181" r="9" fill="url(#beaconGlow)" opacity="0.3"/>
    <rect x="91" y="176" width="18" height="13" fill="#FFE6B8" opacity="0.6" rx="2"/>

    <circle cx="100" cy="214" r="9" fill="url(#beaconGlow)" opacity="0.3"/>
    <rect x="91" y="209" width="18" height="13" fill="#FFE6B8" opacity="0.55" rx="2"/>
  </g>

  <!-- Transition zone - tower to tree -->
  <path d="M 85 90 Q 75 82 68 72 L 85 78 Z" fill="#4A9B6F" opacity="0.75"/>
  <path d="M 115 90 Q 125 82 132 72 L 115 78 Z" fill="#4A9B6F" opacity="0.75"/>

  <!-- Intricate branches - organic flowing curves -->
  <g id="branches" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left branches -->
    <path d="M 85 85 Q 68 78 52 68 Q 42 62 32 55 Q 26 50 20 45"
          stroke="#8B6F5A" stroke-width="5.5" fill="none"/>
    <path d="M 82 75 Q 68 69 54 61 Q 45 56 35 50"
          stroke="#9B7A5E" stroke-width="4.2" fill="none" opacity="0.9"/>
    <path d="M 88 65 Q 78 60 68 54 Q 60 49 52 43"
          stroke="#A0826D" stroke-width="3.2" fill="none" opacity="0.8"/>
    <path d="M 78 72 Q 64 66 50 58"
          stroke="#8B6F5A" stroke-width="2.5" fill="none" opacity="0.7"/>

    <!-- Right branches -->
    <path d="M 115 85 Q 132 78 148 68 Q 158 62 168 55 Q 174 50 180 45"
          stroke="#8B6F5A" stroke-width="5.5" fill="none"/>
    <path d="M 118 75 Q 132 69 146 61 Q 155 56 165 50"
          stroke="#9B7A5E" stroke-width="4.2" fill="none" opacity="0.9"/>
    <path d="M 112 65 Q 122 60 132 54 Q 140 49 148 43"
          stroke="#A0826D" stroke-width="3.2" fill="none" opacity="0.8"/>
    <path d="M 122 72 Q 136 66 150 58"
          stroke="#8B6F5A" stroke-width="2.5" fill="none" opacity="0.7"/>

    <!-- Upper branches -->
    <path d="M 92 60 Q 86 48 82 36 Q 79 28 76 20"
          stroke="#9B7A5E" stroke-width="3.8" fill="none"/>
    <path d="M 108 60 Q 114 48 118 36 Q 121 28 124 20"
          stroke="#9B7A5E" stroke-width="3.8" fill="none"/>

    <!-- Central crown branches -->
    <path d="M 100 55 Q 94 40 90 25 Q 88 18 85 12"
          stroke="#A0826D" stroke-width="3.2" fill="none" opacity="0.85"/>
    <path d="M 100 55 Q 106 40 110 25 Q 112 18 115 12"
          stroke="#A0826D" stroke-width="3.2" fill="none" opacity="0.85"/>

    <!-- Fine detail branches -->
    <path d="M 72 62 Q 58 54 45 46"
          stroke="#8B6F5A" stroke-width="2" fill="none" opacity="0.65"/>
    <path d="M 128 62 Q 142 54 155 46"
          stroke="#8B6F5A" stroke-width="2" fill="none" opacity="0.65"/>
  </g>

  <!-- Radiant foliage with layered clusters -->
  <g id="foliage">
    <!-- Left canopy with glow -->
    <circle cx="32" cy="55" r="14" fill="url(#beaconGlow)" opacity="0.2"/>
    <circle cx="32" cy="55" r="11" fill="#6FD89C" opacity="0.9"/>
    <circle cx="52" cy="50" r="12" fill="url(#foliageGlow)" opacity="0.85"/>
    <circle cx="68" cy="48" r="10" fill="#4A9B6F" opacity="0.82"/>
    <circle cx="45" cy="62" r="9" fill="#3D7A5A" opacity="0.78"/>
    <circle cx="25" cy="48" r="8" fill="#6FD89C" opacity="0.75"/>

    <!-- Right canopy with glow -->
    <circle cx="168" cy="55" r="14" fill="url(#beaconGlow)" opacity="0.2"/>
    <circle cx="168" cy="55" r="11" fill="#6FD89C" opacity="0.9"/>
    <circle cx="148" cy="50" r="12" fill="url(#foliageGlow)" opacity="0.85"/>
    <circle cx="132" cy="48" r="10" fill="#4A9B6F" opacity="0.82"/>
    <circle cx="155" cy="62" r="9" fill="#3D7A5A" opacity="0.78"/>
    <circle cx="175" cy="48" r="8" fill="#6FD89C" opacity="0.75"/>

    <!-- Top canopy with glow -->
    <circle cx="90" cy="25" r="11" fill="url(#foliageGlow)" opacity="0.88"/>
    <circle cx="110" cy="25" r="11" fill="url(#foliageGlow)" opacity="0.88"/>
    <circle cx="100" cy="18" r="9" fill="#6FD89C" opacity="0.85"/>
    <circle cx="82" cy="32" r="8" fill="#4A9B6F" opacity="0.8"/>
    <circle cx="118" cy="32" r="8" fill="#4A9B6F" opacity="0.8"/>
    <circle cx="100" cy="12" r="7" fill="#6FD89C" opacity="0.82"/>

    <!-- Additional detail foliage -->
    <circle cx="60" cy="56" r="7" fill="#4A9B6F" opacity="0.75"/>
    <circle cx="140" cy="56" r="7" fill="#4A9B6F" opacity="0.75"/>
    <circle cx="38" cy="68" r="6" fill="#3D7A5A" opacity="0.7"/>
    <circle cx="162" cy="68" r="6" fill="#3D7A5A" opacity="0.7"/>
  </g>

  <!-- Lighthouse beacon - radiant top -->
  <g id="beacon">
    <!-- Beacon structure -->
    <path d="M 88 52 L 88 48 L 112 48 L 112 52 Z" fill="#C8876A"/>
    <polygon points="88,48 100,38 112,48" fill="#D4A574"/>

    <!-- Massive radiant glow -->
    <circle cx="100" cy="42" r="35" fill="url(#beaconGlow)" opacity="0.35"/>
    <circle cx="100" cy="42" r="25" fill="url(#beaconGlow)" opacity="0.45"/>
    <circle cx="100" cy="42" r="16" fill="url(#beaconGlow)" opacity="0.6"/>
    <circle cx="100" cy="42" r="8" fill="#FFE6B8" opacity="0.8"/>

    <!-- Radiant light rays -->
    <g opacity="0.5">
      <path d="M 100 42 L 82 15" stroke="#FFE6B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M 100 42 L 118 15" stroke="#FFE6B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M 100 42 L 68 28" stroke="#F4D6A0" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 100 42 L 132 28" stroke="#F4D6A0" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 100 42 L 75 38" stroke="#D4A574" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 100 42 L 125 38" stroke="#D4A574" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 100 42 L 90 18" stroke="#FFE6B8" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 100 42 L 110 18" stroke="#FFE6B8" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Lens sparkles -->
    <circle cx="96" cy="40" r="2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="104" cy="44" r="1.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="100" cy="42" r="2.5" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Central energy connection point -->
  <circle cx="100" cy="140" r="6" fill="url(#beaconGlow)" opacity="0.4"/>
  <circle cx="100" cy="140" r="3" fill="#FFE6B8" opacity="0.6"/>
</svg>
