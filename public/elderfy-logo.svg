<svg width="200" height="280" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radiant beacon gradient -->
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE6B8;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F4D6A0;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#D4A574;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#C8876A;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="trunkBark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6D5540;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#8B6F5A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7A6249;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#8D7059;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D5540;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="foliageGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6FD89C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4A9B6F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D7A5A;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="rootGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B7E20;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8942B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6F1E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Radiant outer aura -->
  <ellipse cx="100" cy="140" rx="85" ry="130" fill="url(#beaconGlow)" opacity="0.2"/>

  <!-- Realistic root system -->
  <g id="roots" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main taproot -->
    <path d="M 100 240 Q 99 248 100 256 Q 101 264 100 272"
          stroke="url(#rootGlow)" stroke-width="6" fill="none" opacity="0.85"/>

    <!-- Left primary root with natural splits -->
    <path d="M 97 242 Q 88 248 79 256 Q 70 264 61 272 Q 54 278 47 284"
          stroke="url(#rootGlow)" stroke-width="5" fill="none"/>
    <path d="M 79 256 Q 72 262 65 269 Q 59 275 53 281"
          stroke="#B8942B" stroke-width="3.5" fill="none" opacity="0.8"/>
    <path d="M 65 269 Q 58 275 51 281"
          stroke="#9B7E20" stroke-width="2.5" fill="none" opacity="0.7"/>

    <!-- Right primary root with natural splits -->
    <path d="M 103 242 Q 112 248 121 256 Q 130 264 139 272 Q 146 278 153 284"
          stroke="url(#rootGlow)" stroke-width="5" fill="none"/>
    <path d="M 121 256 Q 128 262 135 269 Q 141 275 147 281"
          stroke="#B8942B" stroke-width="3.5" fill="none" opacity="0.8"/>
    <path d="M 135 269 Q 142 275 149 281"
          stroke="#9B7E20" stroke-width="2.5" fill="none" opacity="0.7"/>

    <!-- Secondary root splits -->
    <path d="M 91 250 Q 82 258 73 266 Q 66 272 59 279"
          stroke="#8A6F1E" stroke-width="3" fill="none" opacity="0.75"/>
    <path d="M 109 250 Q 118 258 127 266 Q 134 272 141 279"
          stroke="#8A6F1E" stroke-width="3" fill="none" opacity="0.75"/>

    <!-- Fine rootlets -->
    <path d="M 85 260 Q 76 267 67 275"
          stroke="#8A6F1E" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 115 260 Q 124 267 133 275"
          stroke="#8A6F1E" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Earth/root clusters -->
  <g id="root-earth">
    <ellipse cx="100" cy="275" rx="10" ry="8" fill="#B8942B" opacity="0.6" transform="rotate(5 100 275)"/>
    <ellipse cx="65" cy="275" rx="8" ry="7" fill="#9B7E20" opacity="0.55" transform="rotate(-12 65 275)"/>
    <ellipse cx="135" cy="275" rx="8" ry="7" fill="#9B7E20" opacity="0.55" transform="rotate(12 135 275)"/>
    <ellipse cx="47" cy="280" rx="7" ry="6" fill="#8A6F1E" opacity="0.5" transform="rotate(18 47 280)"/>
    <ellipse cx="153" cy="280" rx="7" ry="6" fill="#8A6F1E" opacity="0.5" transform="rotate(-18 153 280)"/>
  </g>

  <!-- Foundation - organic transition -->
  <path d="M 83 222 Q 81 230 80 238 L 90 238 Q 94 234 100 232 Q 106 234 110 238 L 120 238 Q 119 230 117 222 Z"
        fill="url(#trunkBark)" opacity="0.8"/>

  <!-- Realistic trunk/tower with natural taper and bark texture -->
  <g id="trunk">
    <!-- Main trunk body - tapers from bottom to top -->
    <path d="M 90 238 Q 88 220 88 200 Q 89 175 90 150 Q 91 125 92 100 Q 93 75 94 55 Q 95 45 96 38
             L 104 38 Q 105 45 106 55 Q 107 75 108 100 Q 109 125 110 150 Q 111 175 112 200 Q 112 220 110 238 Z"
          fill="url(#trunkBark)"/>

    <!-- Bark texture lines - vertical grain -->
    <path d="M 93 225 Q 92 185 93 145 Q 94 105 93 65"
          stroke="#5C4832" stroke-width="1" opacity="0.4" fill="none"/>
    <path d="M 100 225 Q 100 180 100 135 Q 100 90 100 45"
          stroke="#5C4832" stroke-width="1.2" opacity="0.5" fill="none"/>
    <path d="M 107 225 Q 108 185 107 145 Q 106 105 107 65"
          stroke="#5C4832" stroke-width="1" opacity="0.4" fill="none"/>

    <!-- Knots and bark irregularities -->
    <ellipse cx="95" cy="180" rx="2.5" ry="3.5" fill="#5C4832" opacity="0.35"/>
    <ellipse cx="105" cy="145" rx="2" ry="3" fill="#5C4832" opacity="0.3"/>
    <ellipse cx="98" cy="105" rx="2" ry="2.5" fill="#5C4832" opacity="0.28"/>
    <ellipse cx="103" cy="70" rx="1.8" ry="2.3" fill="#5C4832" opacity="0.25"/>
  </g>

  <!-- Lighthouse windows with warm glow -->
  <g id="windows">
    <ellipse cx="100" cy="210" rx="8" ry="7" fill="url(#beaconGlow)" opacity="0.25"/>
    <rect x="93" y="206" width="14" height="10" fill="#FFE6B8" opacity="0.6" rx="1.5"/>

    <ellipse cx="100" cy="175" rx="8" ry="7" fill="url(#beaconGlow)" opacity="0.25"/>
    <rect x="93" y="171" width="14" height="10" fill="#FFE6B8" opacity="0.55" rx="1.5"/>

    <ellipse cx="100" cy="140" rx="8" ry="7" fill="url(#beaconGlow)" opacity="0.25"/>
    <rect x="93" y="136" width="14" height="10" fill="#FFE6B8" opacity="0.5" rx="1.5"/>

    <ellipse cx="100" cy="105" rx="8" ry="7" fill="url(#beaconGlow)" opacity="0.25"/>
    <rect x="93" y="101" width="14" height="10" fill="#FFE6B8" opacity="0.45" rx="1.5"/>
  </g>

  <!-- Transition zone - tower to tree -->
  <path d="M 96 38 Q 90 34 84 28 L 96 32 Z" fill="#4A9B6F" opacity="0.7"/>
  <path d="M 104 38 Q 110 34 116 28 L 104 32 Z" fill="#4A9B6F" opacity="0.7"/>

  <!-- Realistic branches with natural splitting and tapering -->
  <g id="branches" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left primary branch - thick to thin -->
    <path d="M 96 38 Q 88 35 80 30 Q 72 25 64 20 Q 58 16 52 12"
          stroke="#8B6F5A" stroke-width="4.5" fill="none"/>
    <path d="M 80 30 Q 74 27 68 23 Q 63 20 58 16"
          stroke="#7A6249" stroke-width="3.2" fill="none" opacity="0.85"/>
    <path d="M 68 23 Q 62 20 56 17 Q 52 14 48 11"
          stroke="#6D5540" stroke-width="2.2" fill="none" opacity="0.75"/>

    <!-- Right primary branch - thick to thin -->
    <path d="M 104 38 Q 112 35 120 30 Q 128 25 136 20 Q 142 16 148 12"
          stroke="#8B6F5A" stroke-width="4.5" fill="none"/>
    <path d="M 120 30 Q 126 27 132 23 Q 137 20 142 16"
          stroke="#7A6249" stroke-width="3.2" fill="none" opacity="0.85"/>
    <path d="M 132 23 Q 138 20 144 17 Q 148 14 152 11"
          stroke="#6D5540" stroke-width="2.2" fill="none" opacity="0.75"/>

    <!-- Secondary branches -->
    <path d="M 92 50 Q 84 46 76 41 Q 70 37 64 32"
          stroke="#8B6F5A" stroke-width="3.8" fill="none" opacity="0.9"/>
    <path d="M 76 41 Q 70 37 64 33"
          stroke="#7A6249" stroke-width="2.5" fill="none" opacity="0.8"/>

    <path d="M 108 50 Q 116 46 124 41 Q 130 37 136 32"
          stroke="#8B6F5A" stroke-width="3.8" fill="none" opacity="0.9"/>
    <path d="M 124 41 Q 130 37 136 33"
          stroke="#7A6249" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- Upper branches - thinner -->
    <path d="M 97 55 Q 91 50 85 44 Q 80 39 75 34"
          stroke="#7A6249" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 85 44 Q 79 39 73 34"
          stroke="#6D5540" stroke-width="2" fill="none" opacity="0.7"/>

    <path d="M 103 55 Q 109 50 115 44 Q 120 39 125 34"
          stroke="#7A6249" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M 115 44 Q 121 39 127 34"
          stroke="#6D5540" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- Central crown branches -->
    <path d="M 98 60 Q 94 52 90 44 Q 87 38 84 32"
          stroke="#7A6249" stroke-width="2.8" fill="none" opacity="0.75"/>
    <path d="M 102 60 Q 106 52 110 44 Q 113 38 116 32"
          stroke="#7A6249" stroke-width="2.8" fill="none" opacity="0.75"/>

    <!-- Fine twigs -->
    <path d="M 80 30 Q 74 26 68 22"
          stroke="#6D5540" stroke-width="1.6" fill="none" opacity="0.65"/>
    <path d="M 120 30 Q 126 26 132 22"
          stroke="#6D5540" stroke-width="1.6" fill="none" opacity="0.65"/>
  </g>

  <!-- Organic foliage with natural clustering -->
  <g id="foliage">
    <!-- Left canopy - layered organic shapes -->
    <ellipse cx="52" cy="12" rx="14" ry="12" fill="url(#beaconGlow)" opacity="0.2"/>
    <ellipse cx="52" cy="12" rx="11" ry="9" fill="#6FD89C" opacity="0.85" transform="rotate(20 52 12)"/>
    <ellipse cx="45" cy="18" rx="10" ry="8" fill="url(#foliageGlow)" opacity="0.8" transform="rotate(-15 45 18)"/>
    <ellipse cx="60" cy="20" rx="9" ry="7" fill="#4A9B6F" opacity="0.75" transform="rotate(28 60 20)"/>
    <ellipse cx="52" cy="26" rx="8" ry="7" fill="#3D7A5A" opacity="0.72" transform="rotate(-10 52 26)"/>
    <ellipse cx="38" cy="24" rx="7" ry="6" fill="#4A9B6F" opacity="0.7" transform="rotate(18 38 24)"/>

    <!-- Right canopy - layered organic shapes -->
    <ellipse cx="148" cy="12" rx="14" ry="12" fill="url(#beaconGlow)" opacity="0.2"/>
    <ellipse cx="148" cy="12" rx="11" ry="9" fill="#6FD89C" opacity="0.85" transform="rotate(-20 148 12)"/>
    <ellipse cx="155" cy="18" rx="10" ry="8" fill="url(#foliageGlow)" opacity="0.8" transform="rotate(15 155 18)"/>
    <ellipse cx="140" cy="20" rx="9" ry="7" fill="#4A9B6F" opacity="0.75" transform="rotate(-28 140 20)"/>
    <ellipse cx="148" cy="26" rx="8" ry="7" fill="#3D7A5A" opacity="0.72" transform="rotate(10 148 26)"/>
    <ellipse cx="162" cy="24" rx="7" ry="6" fill="#4A9B6F" opacity="0.7" transform="rotate(-18 162 24)"/>

    <!-- Top canopy - crown -->
    <ellipse cx="90" cy="35" rx="10" ry="8" fill="url(#foliageGlow)" opacity="0.82" transform="rotate(12 90 35)"/>
    <ellipse cx="110" cy="35" rx="10" ry="8" fill="url(#foliageGlow)" opacity="0.82" transform="rotate(-12 110 35)"/>
    <ellipse cx="100" cy="30" rx="9" ry="7" fill="#6FD89C" opacity="0.8" transform="rotate(-8 100 30)"/>
    <ellipse cx="85" cy="42" rx="7" ry="6" fill="#4A9B6F" opacity="0.75" transform="rotate(22 85 42)"/>
    <ellipse cx="115" cy="42" rx="7" ry="6" fill="#4A9B6F" opacity="0.75" transform="rotate(-22 115 42)"/>

    <!-- Mid-level foliage -->
    <ellipse cx="68" cy="28" rx="8" ry="7" fill="#4A9B6F" opacity="0.73" transform="rotate(16 68 28)"/>
    <ellipse cx="132" cy="28" rx="8" ry="7" fill="#4A9B6F" opacity="0.73" transform="rotate(-16 132 28)"/>
  </g>

  <!-- Lighthouse beacon - radiant top -->
  <g id="beacon">
    <!-- Beacon structure -->
    <path d="M 94 60 L 94 57 L 106 57 L 106 60 Z" fill="#C8876A"/>
    <polygon points="94,57 100,48 106,57" fill="#D4A574"/>

    <!-- Massive radiant glow -->
    <circle cx="100" cy="52" r="32" fill="url(#beaconGlow)" opacity="0.35"/>
    <circle cx="100" cy="52" r="22" fill="url(#beaconGlow)" opacity="0.45"/>
    <circle cx="100" cy="52" r="14" fill="url(#beaconGlow)" opacity="0.6"/>
    <circle cx="100" cy="52" r="7" fill="#FFE6B8" opacity="0.8"/>

    <!-- Radiant light rays -->
    <g opacity="0.5">
      <path d="M 100 52 L 86 28" stroke="#FFE6B8" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 100 52 L 114 28" stroke="#FFE6B8" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 100 52 L 74 40" stroke="#F4D6A0" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 100 52 L 126 40" stroke="#F4D6A0" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 100 52 L 80 48" stroke="#D4A574" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 100 52 L 120 48" stroke="#D4A574" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 100 52 L 92 30" stroke="#FFE6B8" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 100 52 L 108 30" stroke="#FFE6B8" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Lens sparkles -->
    <circle cx="97" cy="50" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="103" cy="54" r="1.3" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="100" cy="52" r="2" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Central energy connection point -->
  <ellipse cx="100" cy="140" rx="6" ry="5" fill="url(#beaconGlow)" opacity="0.4" transform="rotate(5 100 140)"/>
  <circle cx="100" cy="140" r="3" fill="#FFE6B8" opacity="0.6"/>
</svg>
